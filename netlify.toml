# Netlify Auto-Deployment Configuration for Al Mustafa Heights ERP

[build]
  base = "01-web-application"
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) redirect rule to avoid 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
